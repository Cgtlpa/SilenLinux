# instantWM configuration — matched to dark space wallpaper
# Bar forced to near-black to blend with wallpaper.

theme = "catppuccin-mocha"

# Dark top bar to match wallhaven-216d1g (near-black space)
[colors.status]
foreground = "#CDD6F4"
background = "#000000"
detail = "#000000"
separator = "#11111B"
hover = "#B4BEFE"

[colors.tag.normal.inactive]
foreground = "#CDD6F4"
background = "#000000"
detail = "#000000"

[colors.tag.normal.filled]
foreground = "#CDD6F4"
background = "#11111B"
detail = "#1E1E2E"

[colors.tag.hover.inactive]
foreground = "#CDD6F4"
background = "#0A0A12"
detail = "#000000"

[colors.tag.hover.filled]
foreground = "#CDD6F4"
background = "#1A1A2E"
detail = "#2A2A3E"

[colors.border]
normal = "#000000"
tile_focus = "#000000"
float_focus = "#000000"
snap = "#000000"

# Middle bar - active app title (was light blue #313244 / #6B8BC2)
[colors.window.normal.focus]
foreground = "#CDD6F4"
background = "#000000"
detail = "#11111B"

[colors.window.normal.normal]
foreground = "#CDD6F4"
background = "#000000"
detail = "#000000"

[colors.window.hover.focus]
foreground = "#CDD6F4"
background = "#0A0A12"
detail = "#11111B"

[colors.window.hover.normal]
foreground = "#CDD6F4"
background = "#000000"
detail = "#000000"

# Startup apps are managed by systemd user services (survive reboot reliably):
# vicinae-server.service + swaybg-wallpaper.service - use
# `systemctl --user status <name>` to check them.
exec_once = []

[[keybinds]]
modifiers = ["super"]
key = "space"
action = { spawn = ["/home/vgz/.local/bin/vicinae", "toggle"] }

[[keybinds]]
modifiers = ["super"]
key = "v"
action = "toggle_floating"

[[keybinds]]
modifiers = ["super", "shift"]
key = "s"
action = { spawn = ["sh", "-c", "/home/vgz/.local/bin/slurp | /home/vgz/.local/bin/grim -g - - | /usr/bin/wl-copy"] }

[layout]
inner_gap = 10
outer_gap = 10
smart_gaps = false
maximized_gaps = false

[window]
border_width_px = 2

[animations]
enabled = true
speed = 1.2

[monitors.HDMI-A-1]
resolution = "1920x1080"
refresh_rate = 180.0

[input."type:pointer"]
accel_profile = "flat"
